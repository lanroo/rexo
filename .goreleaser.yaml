version: 2

project_name: rexo

builds:
  - id: rexo
    main: ./cmd/rexo
    binary: rexo
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - >-
        -s -w
        -X main.version={{.Version}}
        -X main.commit={{.Commit}}
        -X main.date={{.Date}}

archives:
  - id: default
    # Version-less names so /releases/latest/download/<asset> links stay stable
    # across releases (e.g. rexo_windows_amd64.zip, rexo_linux_amd64.tar.gz).
    name_template: "rexo_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - README.pt-BR.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

scoops:
  - repository:
      owner: lanroo
      name: rexo
    directory: bucket
    homepage: "https://github.com/lanroo/rexo"
    description: "REXO — Runtime for Execution & eXchange Orchestration."
    license: Apache-2.0
    commit_author:
      name: goreleaser-bot
      email: bot@rexo.dev

brews:
  - repository:
      owner: lanroo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lanroo/rexo"
    description: "REXO — Runtime for Execution & eXchange Orchestration."
    license: "Apache-2.0"
    commit_author:
      name: goreleaser-bot
      email: bot@rexo.dev
    test: |
      system "#{bin}/rexo", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
